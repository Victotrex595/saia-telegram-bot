name: Notificador SAIA Telegram

on:
  schedule:
    # 8:00 AM hora de Venezuela (UTC-4 -> 12:00 UTC)
    - cron: '0 12 * * *'
    # 8:00 PM hora de Venezuela (UTC-4 -> 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-saia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar verificación de SAIA y enviar a Telegram
        env:
          MOODLE_SESSION: ${{ secrets.MOODLE_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python saia_bot.py

      - name: Guardar estado actualizado en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add saia_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar estado SAIA [skip ci]" && git push)
